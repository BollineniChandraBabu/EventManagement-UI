<div class="page calendar-page">
  <div class="page-header"><div class="page-header-left"><span class="page-header-icon blue"><i class="fa-solid fa-calendar-days"></i></span><div><h1 class="page-header-title">Calendar</h1><p class="page-header-subtitle">See all of your scheduled celebrations at a glance</p></div></div></div>
  <section class="calendar card" aria-label="Event calendar">
    <div class="calendar-toolbar"><div class="calendar-navigation"><button class="btn btn-outline-secondary" (click)="previous()" aria-label="Previous period"><i class="fa-solid fa-chevron-left"></i></button><button class="btn btn-outline-secondary" (click)="today()">Today</button><button class="btn btn-outline-secondary" (click)="next()" aria-label="Next period"><i class="fa-solid fa-chevron-right"></i></button><h2>{{ title }}</h2></div><div class="view-switch" role="group" aria-label="Calendar view"><button *ngFor="let option of ['month','week','day']" class="btn" [class.btn-primary]="view === option" [class.btn-outline-secondary]="view !== option" (click)="setView($any(option))">{{ option | titlecase }}</button></div></div>
    <div class="calendar-grid" [class.week-view]="view === 'week'" [class.day-view]="view === 'day'"><div class="weekday" *ngFor="let weekday of (view === 'day' ? [] : weekdays)">{{ weekday }}</div><article class="calendar-day" *ngFor="let day of days" [class.outside-month]="!day.inMonth" [class.today]="isToday(day.date)"><div class="day-number">{{ day.date | date:'d' }}</div><div class="calendar-event" *ngFor="let event of day.events" [title]="event.eventType + ': ' + (event.userName || 'Event')"><span>{{ event.eventType || 'Event' }}</span><small>{{ event.userName || 'Celebration' }}</small></div><p class="no-events" *ngIf="!day.events.length && view === 'day'">No events scheduled</p></article></div>
    <div class="calendar-loading" *ngIf="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading events…</div>
  </section>
</div>
