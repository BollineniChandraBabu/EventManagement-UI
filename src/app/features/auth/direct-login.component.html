<div class="auth-layout">
  <div class="auth-card">
    <a class="auth-brand" routerLink="/login">
      <span class="auth-brand-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
      <span class="auth-brand-name">Golden Greetings</span>
    </a>

    <div class="auth-hero-icon">
      <i class="fa-solid" [ngClass]="working() ? 'fa-spinner fa-spin' : 'fa-link'"></i>
    </div>

    <h1 class="auth-title">{{ working() ? 'Signing you in' : 'Sign-in link' }}</h1>
    <p class="auth-subtitle">{{ message() }}</p>

    <div class="auth-form" *ngIf="!working()">
      <button class="btn btn-primary w-100 py-2" type="button" (click)="goToLogin()">
        <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Go to sign in
      </button>
    </div>
  </div>
</div>
